[project]
name = "auto-home"
version = "0.1.0"
description = "Smart Home Controller Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pypetkitapi",
    "python-dotenv",
    "sqlmodel",
    "pymysql",
    "aiohttp",
    "httpx",
    "requests",
    "pydantic",
    "psycopg2-binary",
    "cryptography",
    "pycryptodome",
    "pillow",
    "charset-normalizer",
    "colorama",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "websockets>=13,<14",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["backend*"]
